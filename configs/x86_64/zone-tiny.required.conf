# Zone kernel REQUIRED symbols (x86_64): the boot / I/O / security / observability
# contract a zone must satisfy under both KVM (Cloud Hypervisor) and Xen. The build
# fails if any of these does not resolve to =y or =m. See hack/build/verify-config.py.

# Boot / console: KVM ttyS0 (8250), Xen hvc0, PVH ELF boot, pvpanic
CONFIG_PVH
CONFIG_SERIAL_8250_CONSOLE
CONFIG_HVC_XEN
CONFIG_PVPANIC
CONFIG_BINFMT_ELF
CONFIG_BINFMT_MISC
CONFIG_TTY
CONFIG_DEVTMPFS
CONFIG_DEBUG_FS
CONFIG_SECURITYFS
CONFIG_BLK_DEV_INITRD

# Storage a zone actually uses
CONFIG_VIRTIO_BLK
CONFIG_XEN_BLKDEV_FRONTEND
CONFIG_VIRTIO_FS
CONFIG_EXT4_FS
CONFIG_SQUASHFS
CONFIG_EROFS_FS
CONFIG_OVERLAY_FS
CONFIG_9P_FS
CONFIG_NET_9P_XEN
CONFIG_NFS_FS
CONFIG_ISO9660_FS
CONFIG_BLK_DEV_DM

# Networking
CONFIG_INET
CONFIG_VIRTIO_NET
CONFIG_XEN_NETDEV_FRONTEND
CONFIG_BRIDGE
CONFIG_VETH

# IDM: KVM vsock + ivshmem-via-VFIO_PCI; Xen channels via userspace
CONFIG_VSOCKETS
CONFIG_VIRTIO_VSOCKETS
CONFIG_VFIO_PCI
CONFIG_VIRTIO_IOMMU
CONFIG_XEN_PRIVCMD
CONFIG_XEN_GNTDEV
CONFIG_XEN_DEV_EVTCHN

# Memory / balloon: KVM virtio-mem + virtio-balloon, Xen xen-balloon
CONFIG_VIRTIO_MEM
CONFIG_VIRTIO_BALLOON
CONFIG_MEMORY_HOTPLUG
CONFIG_XEN_BALLOON
CONFIG_ZONE_DEVICE

# Isolation / security / observability
CONFIG_CGROUPS
CONFIG_NAMESPACES
CONFIG_USER_NS
CONFIG_SECCOMP
CONFIG_SECURITY_APPARMOR
CONFIG_SECURITY_SELINUX
CONFIG_SECURITY_LANDLOCK
CONFIG_BPF_SYSCALL
CONFIG_BPF_EVENTS
CONFIG_DEBUG_INFO_BTF
CONFIG_KPROBES
CONFIG_FUNCTION_TRACER
