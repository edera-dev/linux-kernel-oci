# Zone kernel FORBIDDEN symbols (x86_64): things a zone must never ship. On the
# tinyconfig allowlist base most are off by default, so this is the guard against a
# fragment or a future upstream default pulling them back. The build fails if any
# resolves to =y or =m. See hack/build/verify-config.py.

# Hardware classes a virtio/xen guest does not have
CONFIG_SOUND
CONFIG_WIRELESS
CONFIG_WLAN
CONFIG_BT
CONFIG_USB_SUPPORT
CONFIG_MEDIA_SUPPORT
CONFIG_DRM
CONFIG_FB
CONFIG_HID_SUPPORT
CONFIG_ATA
CONFIG_SATA_HOST
CONFIG_IPMI_HANDLER

# Power / boot features a zone does not use (dom0/host owns them). THERMAL is not
# forbidden: its core is pulled on by ACPI_PROCESSOR (which provides guest cpuidle),
# and only the thermal-zone drivers are disabled in the fragment.
CONFIG_POWER_SUPPLY
CONFIG_CPU_FREQ
CONFIG_HIBERNATION
CONFIG_SUSPEND
CONFIG_KEXEC
CONFIG_CRASH_DUMP

# dom0-only Xen features (the zone is frontend-only)
CONFIG_XEN_DOM0
CONFIG_XEN_BACKEND

# Exotic ciphers never selected by LUKS/dm-crypt (AES is the default)
CONFIG_CRYPTO_ARIA
CONFIG_CRYPTO_SM4
CONFIG_CRYPTO_CAMELLIA_X86_64
CONFIG_CRYPTO_SERPENT
CONFIG_CRYPTO_TWOFISH_X86_64
CONFIG_CRYPTO_CAST5
CONFIG_CRYPTO_CAST6
CONFIG_CRYPTO_BLOWFISH_X86_64

# Headless workload VM: no VGA console, PS/2 input, rfkill/nfc, non-AMD/Intel CPU
# support, or CPU-package thermal driver.
CONFIG_VGA_CONSOLE
CONFIG_VGA_ARB
CONFIG_SERIO
CONFIG_KEYBOARD_ATKBD
CONFIG_MOUSE_PS2
CONFIG_RFKILL
CONFIG_NFC
CONFIG_CPU_SUP_HYGON
CONFIG_CPU_SUP_CENTAUR
CONFIG_CPU_SUP_ZHAOXIN
CONFIG_X86_PKG_TEMP_THERMAL

# Minimization leaves: present in the full `zone` flavor, deliberately off here,
# none on a Xen/KVM boot or IDM path. Guards the cut against upstream default churn
# or a select pulling them back.
CONFIG_IA32_EMULATION
CONFIG_KSM
CONFIG_ZSWAP
CONFIG_IOSCHED_BFQ
CONFIG_BFQ_GROUP_IOSCHED
CONFIG_CONNECTOR
CONFIG_DYNAMIC_DEBUG
CONFIG_CRYPTO_DEV_VIRTIO
CONFIG_EROFS_FS_ZIP_LZMA
CONFIG_EROFS_FS_ZIP_DEFLATE
