# Zone kernel WHITELIST (x86_64): symbols exempt from the stickiness and forbidden
# checks because they can legitimately not resolve in a given tree. See
# hack/build/verify-config.py.

# Added by Edera patches; absent from a vanilla tree but present in the patched build.
CONFIG_XEN_IOMMU

# DEBUG_INFO_BTF and GCC_PLUGINS need pahole / gcc-plugin headers at configure time.
# They resolve correctly in the buildenv (which has them) but not in a toolchain-less
# resolve, so exempt them from stickiness while the required manifest still enforces
# DEBUG_INFO_BTF against the in-build .config.
CONFIG_GCC_PLUGINS

# Toolchain-gated: the compression choice degrades to NONE without -gz=zstd support.
CONFIG_DEBUG_INFO_COMPRESSED_ZSTD
