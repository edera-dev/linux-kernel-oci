imageNameFormat: "ghcr.io/edera-dev/[image]:[tag]"

# Kernel sources come from Edera's downstream Linux tree. Every branch listed
# below carries the full Edera patch stack as commits, so this repo no longer
# fetches kernel.org tarballs and no longer carries a patch series of its own:
# what the branch says is what gets built. Adding or dropping a patch is a
# commit on edera-dev/linux, not a change here.
source:
  repo: https://github.com/edera-dev/linux

# Each branch produces one build per (flavor, architecture). The kernel version
# comes from the branch's Makefile at the resolved commit, so it tracks whatever
# the branch has been rebased onto without anything here needing an edit.
#
# Every build publishes an immutable `<version>-g<short commit>` tag plus moving
# aliases: `<version>`, the `<major>.<minor>` series (release kernels only -- a
# prerelease must not claim the series tag its final release will want), the
# branch name, and anything in `aliases`.
branches:
- name: 6.18-lts
  ref: edera/6.18-lts
  # The LTS branch is what a consumer that pins nothing should get.
  aliases:
  - latest
- name: mainline
  ref: edera/mainline

# Default set of architectures applied to any flavor that does not override it.
architectures:
- x86_64

flavors:
- name: zone
  # zone is the only flavor we currently publish for aarch64. Other flavors fall
  # back to the global `architectures` list above; add an `architectures:` entry
  # here to opt them in.
  architectures:
  - x86_64
  - aarch64
- name: zone-kvm
  # zone kernel built with kvm and nbd enabled for e2e testing in the protect repo
  architectures:
  - x86_64
  constraints:
    lower: '6.1'
- name: zone-tiny
  # Experimental minimal microVM kernel: a tinyconfig base + an explicit allowlist
  # (configs/x86_64/zone-tiny.config), gated by zone-tiny.{required,forbidden}.conf.
  architectures:
  - x86_64
  constraints:
    lower: '6.18'
- name: zone-amdgpu
  constraints:
    lower: '6.1'
- name: zone-nvidiagpu
  # we will generate distinct images for each of these
  # local tags. For `zone-nvidiagpu` specifically,
  # we will build that distinct image with the nvidia driver
  # version defined here.
  # Note that the version numbers here can be found on this page:
  #     https://www.nvidia.com/en-us/drivers/unix/
  # Note also that we have scripts to bump these version numbers that
  # depend on the below comment anchors being present, for the time being
  local_tags:
  - 'nvidia-610.57.04'    # Nvidia: "Latest New Feature Branch Version"
  - 'nvidia-595.45.04'    # Nvidia: "Latest Beta Version"
  - 'nvidia-595.91.07'   # Nvidia: "Latest Production Branch Version"
  constraints:
    # NVIDIA's open kernel modules trail mainline, so this flavor is pinned to
    # the LTS branch -- which is also the only place it has ever actually built.
    # Add `mainline` here once the driver series in local_tags compiles against
    # whatever edera/mainline is currently rebased onto.
    branches:
    - 6.18-lts
- name: host

# zone-openpax is parked: the openpax series has not been restored on the Edera
# branches yet. Its kconfig fragments are still in configs/, so re-enabling it
# is a matter of uncommenting this entry once the series lands (and constraining
# it to the branches that carry it).
# - name: zone-openpax

images:
- target: kernelsrc
  name: kernel-src
  publish: false
  passBuildArgs: false
- target: buildenv
  name: kernel-buildenv
  publish: false
  passBuildArgs: false
  version: local
  tags:
  - local
- target: kernel
  name: "[flavor]-kernel"
  format: kernel
- target: sdk
  name: "[flavor]-kernel-sdk"
  format: kernel.sdk

runners:
# Match order matters: first runner whose constraints match wins.
- name: ubuntu-24.04-arm
  arch: aarch64
- name: edera-24
  arch: x86_64
  flavors:
  - host
  - zone-amdgpu
  - zone-nvidiagpu
- name: edera-24
  arch: x86_64
